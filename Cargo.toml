[workspace]
members = [
    "crates/core",
    "apps/desktop-gmail/src-tauri",
    "apps/desktop-gcalendar/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Andrey Eremin"]
license = "MIT"
repository = "https://github.com/andrey/desktop-google-apps"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
thiserror = "2.0"
tauri = { version = "2.2", features = ["tray-icon", "wry", "image-png"] }
tauri-build = { version = "2.0" }
tauri-plugin-shell = "2.2"
tauri-plugin-notification = "2.2"
