<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Calendar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="splash-container">
    <div class="splash-card">
      <div class="logo" aria-hidden="true">
        <svg width="72" height="72" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="dtCalBack" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#16a34a"/>
              <stop offset="60%" stop-color="#15803d"/>
              <stop offset="100%" stop-color="#14532d"/>
            </linearGradient>
            <linearGradient id="dtCalHead" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#4ade80"/>
              <stop offset="20%" stop-color="#22c55e"/>
              <stop offset="80%" stop-color="#16a34a"/>
              <stop offset="100%" stop-color="#15803d"/>
            </linearGradient>
            <linearGradient id="dtCalRing" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#cbd5e1"/>
              <stop offset="30%" stop-color="#ffffff"/>
              <stop offset="70%" stop-color="#94a3b8"/>
              <stop offset="100%" stop-color="#64748b"/>
            </linearGradient>
            <clipPath id="dtCalClip">
              <rect x="66" y="96" width="380" height="352" rx="60"/>
            </clipPath>
          </defs>
          <rect x="56" y="86" width="400" height="364" rx="66" fill="url(#dtCalBack)" stroke="#14532d" stroke-width="2"/>
          <rect x="66" y="96" width="380" height="352" rx="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
          <g clip-path="url(#dtCalClip)">
            <rect x="66" y="96" width="380" height="126" fill="url(#dtCalHead)"/>
            <rect x="76" y="97" width="360" height="3.5" rx="1.75" fill="rgba(255,255,255,0.6)"/>
            <line x1="66" y1="222" x2="446" y2="222" stroke="#14532d" stroke-width="3"/>
          </g>
          <g>
            <rect x="146" y="104" width="28" height="36" rx="12" fill="#0f172a" opacity="0.4"/>
            <rect x="142" y="54" width="36" height="78" rx="18" fill="url(#dtCalRing)" stroke="#64748b" stroke-width="1.5"/>
            <rect x="148" y="56" width="6" height="74" rx="3" fill="#ffffff" opacity="0.75"/>
            <rect x="338" y="104" width="28" height="36" rx="12" fill="#0f172a" opacity="0.4"/>
            <rect x="334" y="54" width="36" height="78" rx="18" fill="url(#dtCalRing)" stroke="#64748b" stroke-width="1.5"/>
            <rect x="340" y="56" width="6" height="74" rx="3" fill="#ffffff" opacity="0.75"/>
          </g>
          <text x="256" y="362" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="bold" font-size="142" fill="#15803d" letter-spacing="-3">31</text>
        </svg>
      </div>
      <h1>Desktop Calendar</h1>
      <p class="status" id="status-text">Connecting to Calendar...</p>
      <div class="spinner"></div>
      <div class="offline-actions" id="offline-actions" style="display: none;">
        <div class="offline-msg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
          <span>Unable to connect to Calendar servers.</span>
        </div>
        <button id="retry-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span>Retry Connection</span>
        </button>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
