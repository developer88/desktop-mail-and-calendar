<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Calendar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="splash-container">
    <div class="logo">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 4H18V2H16V4H8V2H6V4H5C3.89 4 3.01 4.9 3.01 6L3 20C3 21.1 3.89 22 5 22H19C20.1 22 21 21.1 21 20V6C21 4.9 20.1 4 19 4ZM19 20H5V9H19V20ZM19 7H5V6H19V7Z" fill="#1A73E8"/>
      </svg>
    </div>
    <h1>Google Calendar</h1>
    <p class="status" id="status-text">Connecting to Google Calendar...</p>
    <div class="spinner"></div>
    <div class="offline-actions" id="offline-actions" style="display: none;">
      <p>Unable to connect to Calendar servers.</p>
      <button id="retry-btn">Retry Connection</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
