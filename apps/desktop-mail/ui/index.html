<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Mail</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="splash-container">
    <div class="logo">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z" fill="#EA4335"/>
      </svg>
    </div>
    <h1>Desktop Mail</h1>
    <p class="status" id="status-text">Connecting to Mail...</p>
    <div class="spinner"></div>
    <div class="offline-actions" id="offline-actions" style="display: none;">
      <p>Unable to connect to Mail servers.</p>
      <button id="retry-btn">Retry Connection</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
